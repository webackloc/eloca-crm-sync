name: Inventário completo BI ELOCA (one-shot)

on:
  workflow_dispatch:

jobs:
  inventario:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends freetds-dev freetds-bin
          pip install --no-cache-dir pymssql openpyxl

      - name: Gerar inventário
        env:
          BI_HOST:     ${{ secrets.BI_HOST }}
          BI_PORT:     ${{ secrets.BI_PORT }}
          BI_DATABASE: ${{ secrets.BI_DATABASE }}
          BI_USER:     ${{ secrets.BI_USER }}
          BI_PASSWORD: ${{ secrets.BI_PASSWORD }}
        run: python src/listar_tabelas_bi.py

      - name: Publicar Excel como artifact
        uses: actions/upload-artifact@v4
        with:
          name: bi-inventario-completo
          path: /tmp/bi_inventario/bi_inventario_completo.xlsx
          retention-days: 7
