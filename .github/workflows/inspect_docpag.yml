name: Inspect docpag
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install pymssql python-dotenv
      - run: |
          python3 - << 'PYEOF'
import pymssql
conn = pymssql.connect(
    server="og-bi.crwm94zs8mf9.sa-east-1.rds.amazonaws.com",
    port=1433, user="weback",
    password="${{ secrets.BI_PASSWORD }}",
    database="biweback", timeout=60, charset="UTF-8"
)
cur = conn.cursor(as_dict=True)
print("=== DOCPAG — colunas e amostra ===")
cur.execute("SELECT TOP 2 * FROM docpag ORDER BY recnum DESC")
for r in cur.fetchall():
    for k, v in r.items():
        print(f"  {k}: {v}")
    print("---")
conn.close()
PYEOF
