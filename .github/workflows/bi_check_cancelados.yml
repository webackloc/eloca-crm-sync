name: BI — Verificar títulos cancelados no Supabase

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends freetds-dev freetds-bin
          pip install pymssql httpx --break-system-packages

      - name: Verificar status_doc cancelados
        env:
          BI_HOST:       ${{ secrets.BI_HOST }}
          BI_PORT:       ${{ secrets.BI_PORT }}
          BI_DATABASE:   ${{ secrets.BI_DATABASE }}
          BI_USER:       ${{ secrets.BI_USER }}
          BI_PASSWORD:   ${{ secrets.BI_PASSWORD }}
          BI_SYNC_TOKEN: ${{ secrets.BI_SYNC_TOKEN }}
        run: |
          python3 - <<'EOF'
          import os, httpx, pymssql

          SUPABASE_URL  = "https://dxkbqxualiqdhvsudshr.supabase.co"
          BI_SYNC_TOKEN = os.environ["BI_SYNC_TOKEN"]

          # ── 1. Fonte: BI SQL Server — o que deveria ter sido enviado ────────
          conn = pymssql.connect(
              server=os.environ["BI_HOST"],
              port=int(os.environ.get("BI_PORT", 1433)),
              database=os.environ["BI_DATABASE"],
              user=os.environ["BI_USER"],
              password=os.environ["BI_PASSWORD"],
              timeout=30, charset="UTF-8",
          )
          cur = conn.cursor(as_dict=True)

          print("\n" + "="*65)
          print("  FONTE BI: títulos com status='1' (CANCELADO) em docrec")
          print("="*65)
          cur.execute("""
              SELECT
                  CONVERT(VARCHAR(30), numfatura)    AS numfatura,
                  CONVERT(VARCHAR(10), numsequencia) AS numsequencia,
                  ISNULL(CONVERT(VARCHAR(200), cliente), '') AS cliente,
                  ISNULL(valoremissao, 0)            AS valoremissao,
                  CONVERT(VARCHAR(10), dataemissao, 120) AS dataemissao,
                  CONVERT(VARCHAR(1), status)        AS status
              FROM docrec
              WHERE status = '1'
          """)
          bi_cancelados = cur.fetchall()
          print(f"\n  Registros cancelados no BI: {len(bi_cancelados)}")
          for r in bi_cancelados:
              print(f"    numfatura={r['numfatura']} seq={r['numsequencia']} "
                    f"valor={r['valoremissao']:,.2f} status={r['status']} "
                    f"cliente={r['cliente'][:40]}")
          conn.close()

          # ── 2. Destino: Supabase via PostgREST ──────────────────────────────
          print("\n" + "="*65)
          print("  SUPABASE: status_doc no bi_faturamento")
          print("="*65)

          headers = {
              "apikey": BI_SYNC_TOKEN,
              "Authorization": f"Bearer {BI_SYNC_TOKEN}",
          }

          # Distribuição de status_doc
          resp = httpx.get(
              f"{SUPABASE_URL}/rest/v1/bi_faturamento",
              params={"select": "status_doc", "limit": "10000"},
              headers=headers, timeout=30,
          )
          print(f"\n  HTTP status da consulta: {resp.status_code}")

          if resp.status_code == 200:
              rows = resp.json()
              contagem = {}
              for r in rows:
                  v = r.get("status_doc") or "(null/vazio)"
                  contagem[v] = contagem.get(v, 0) + 1
              print(f"  Total de registros em bi_faturamento: {len(rows)}")
              print(f"\n  {'STATUS_DOC':<20} {'QTD':>6}")
              print(f"  {'-'*20} {'-'*6}")
              for k, v in sorted(contagem.items(), key=lambda x: -x[1]):
                  print(f"  {str(k):<20} {v:>6}")

              # Registros com status_doc='1'
              cancelados_sb = [r for r in rows if r.get("status_doc") == "1"]
              print(f"\n  Registros com status_doc='1' no Supabase: {len(cancelados_sb)}")
              for r in cancelados_sb:
                  print(f"    {r}")
          else:
              print(f"  Erro: {resp.text[:300]}")
              print("\n  ⚠️  BI_SYNC_TOKEN não tem permissão de leitura no PostgREST.")
              print("     Isso é esperado se o token só autentica na Edge Function.")
              print("     Verifique os cancelados acima na seção FONTE BI —")
              print("     se o backfill rodou sem erros, os dados estão lá.")

          EOF
