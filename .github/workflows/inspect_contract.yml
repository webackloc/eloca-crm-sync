name: Inspect contract table
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install pymssql
      - name: Inspect
        env:
          BI_PASSWORD: ${{ secrets.BI_PASSWORD }}
        run: python3 src/inspect_contract.py
