name: Análise BI (one-shot)

on:
  workflow_dispatch:
    # Rodar manualmente pela aba Actions → "Análise BI (one-shot)"

jobs:
  analise:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências do sistema (FreeTDS)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends freetds-dev freetds-bin

      - name: Instalar pymssql
        run: pip install --no-cache-dir pymssql

      - name: Rodar análise das tabelas BI
        env:
          BI_HOST:     ${{ secrets.BI_HOST }}
          BI_PORT:     ${{ secrets.BI_PORT }}
          BI_DATABASE: ${{ secrets.BI_DATABASE }}
          BI_USER:     ${{ secrets.BI_USER }}
          BI_PASSWORD: ${{ secrets.BI_PASSWORD }}
          PYTHONPATH:  ${{ github.workspace }}/src
        run: python src/analisar_bi_completo.py
